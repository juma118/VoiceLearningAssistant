[project]
name = "voice-learning-api"
version = "0.1.0"
description = "FastAPI backend for a voice-enabled AI learning assistant."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "anthropic>=0.39",
  "chromadb>=0.5",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langdetect>=1.0",
  "openai>=1.54",
  "bcrypt>=4.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.12",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
